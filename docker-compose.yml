services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laluan}
      POSTGRES_USER: ${POSTGRES_USER:-laluan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laluan_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laluan} -d ${POSTGRES_DB:-laluan}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
